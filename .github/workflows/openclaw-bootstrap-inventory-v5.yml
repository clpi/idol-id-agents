name: OpenClaw signed bootstrap inventory v5

on:
  push:
    branches:
      - openclaw/browser-probe-20260828
    paths:
      - .github/workflows/openclaw-bootstrap-inventory-v5.yml

permissions:
  contents: read
  issues: write

jobs:
  inventory:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4

      - name: Publish ephemeral transport key
        id: key
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          run_key="${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          umask 077
          openssl genpkey -algorithm RSA -pkeyopt rsa_keygen_bits:2048 -out /tmp/transport-private.pem >/dev/null 2>&1
          openssl pkey -in /tmp/transport-private.pem -pubout -out /tmp/transport-public.pem >/dev/null 2>&1
          public_b64="$(base64 -w0 /tmp/transport-public.pem)"
          body="$(printf 'IDOL_OPENCLAW_KEY:%s\n%s' "$run_key" "$public_b64")"
          jq -n --arg body "$body" '{body:$body}' >/tmp/key-comment.json
          curl -fsS -X POST \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/issues/1/comments" \
            --data-binary @/tmp/key-comment.json >/dev/null
          echo "run_key=$run_key" >>"$GITHUB_OUTPUT"

      - name: Receive encrypted one-time bootstrap token
        id: receive
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_KEY: ${{ steps.key.outputs.run_key }}
        shell: bash
        run: |
          set -euo pipefail
          cipher=""
          for _ in $(seq 1 240); do
            curl -fsS \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/issues/1/comments?per_page=100" \
              >/tmp/comments.json
            cipher="$(python3 - "$RUN_KEY" /tmp/comments.json <<'PY'
          import json, sys
          key, path = sys.argv[1], sys.argv[2]
          marker = f"IDOL_OPENCLAW_CIPHERTEXT:{key}"
          for comment in reversed(json.load(open(path))):
              body = comment.get("body") or ""
              if body.startswith(marker):
                  rest = body[len(marker):]
                  if rest.startswith("\\n"): rest = rest[2:]
                  elif rest.startswith("\n"): rest = rest[1:]
                  print(rest.strip())
                  break
          PY
            )"
            if [ -n "$cipher" ]; then break; fi
            sleep 2
          done
          if [ -z "$cipher" ]; then
            printf '%s\n' '{"schema":"idol.openclaw.bootstrap-inventory.v1","outcome":"ciphertext-timeout"}' >probe-result.json
            echo "received=false" >>"$GITHUB_OUTPUT"
            exit 0
          fi
          printf '%s' "$cipher" | base64 -d >/tmp/bootstrap-cipher.bin
          openssl pkeyutl -decrypt \
            -inkey /tmp/transport-private.pem \
            -in /tmp/bootstrap-cipher.bin \
            -pkeyopt rsa_padding_mode:oaep \
            -pkeyopt rsa_oaep_md:sha256 \
            -out /tmp/idol-openclaw-bootstrap-token
          token="$(cat /tmp/idol-openclaw-bootstrap-token)"
          echo "::add-mask::$token"
          unset token cipher
          echo "received=true" >>"$GITHUB_OUTPUT"

      - name: Install transport
        if: steps.receive.outputs.received == 'true'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/idol-openclaw-node
          cd /tmp/idol-openclaw-node
          npm init -y >/dev/null 2>&1
          npm install --silent ws@8
          cp "$GITHUB_WORKSPACE/scripts/openclaw-bootstrap-inventory-v5.mjs" ./probe.mjs

      - name: Install local management-envelope public key
        if: steps.receive.outputs.received == 'true'
        shell: bash
        run: |
          set -euo pipefail
          cat >/tmp/management-public.b64 <<'EOF'
          
          EOF
          tr -d '[:space:]' </tmp/management-public.b64 | base64 -d >/tmp/idol-management-public.pem

      - name: Bootstrap signed operator and collect sanitized inventory
        if: steps.receive.outputs.received == 'true'
        shell: bash
        run: |
          set -euo pipefail
          cd /tmp/idol-openclaw-node
          OPENCLAW_BOOTSTRAP_TOKEN_FILE=/tmp/idol-openclaw-bootstrap-token \
          OPENCLAW_MANAGEMENT_PUBLIC_KEY_FILE=/tmp/idol-management-public.pem \
          OPENCLAW_RESULT_FILE="$GITHUB_WORKSPACE/probe-result.json" \
          OPENCLAW_ENVELOPE_FILE="$GITHUB_WORKSPACE/management-envelope.json" \
            node probe.mjs

      - name: Upload sanitized inventory and encrypted management identity
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: openclaw-bootstrap-inventory-${{ steps.key.outputs.run_key }}
          path: |
            probe-result.json
            management-envelope.json
          retention-days: 1
          if-no-files-found: error

      - name: Destroy transient plaintext and keys
        if: always()
        shell: bash
        run: |
          rm -f /tmp/transport-private.pem /tmp/transport-public.pem /tmp/key-comment.json \
            /tmp/bootstrap-cipher.bin /tmp/idol-openclaw-bootstrap-token /tmp/comments.json \
            /tmp/idol-management-public.pem /tmp/management-public.b64
