name: OpenClaw read-only inventory probe

on:
  push:
    branches:
      - openclaw/browser-probe-20260828
    paths:
      - .github/workflows/openclaw-probe.yml

permissions:
  contents: read
  issues: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Check out probe branch
        uses: actions/checkout@v4

      - name: Publish ephemeral encryption key
        id: key
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          run_key="${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          umask 077
          openssl genpkey -algorithm RSA -pkeyopt rsa_keygen_bits:2048 -out /tmp/idol-openclaw-private.pem >/dev/null 2>&1
          openssl pkey -in /tmp/idol-openclaw-private.pem -pubout -out /tmp/idol-openclaw-public.pem >/dev/null 2>&1
          public_b64="$(base64 -w0 /tmp/idol-openclaw-public.pem)"
          body="$(printf 'IDOL_OPENCLAW_KEY:%s\n%s' "$run_key" "$public_b64")"
          jq -n --arg body "$body" '{body:$body}' >/tmp/key-comment.json
          curl -fsS \
            -X POST \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/issues/1/comments" \
            --data-binary @/tmp/key-comment.json >/dev/null
          echo "run_key=$run_key" >>"$GITHUB_OUTPUT"

      - name: Receive encrypted gateway token and run probe
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_KEY: ${{ steps.key.outputs.run_key }}
        shell: bash
        run: |
          set -euo pipefail
          cipher=""
          for _ in $(seq 1 180); do
            curl -fsS \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/issues/1/comments?per_page=100" \
              >/tmp/comments.json
            cipher="$(python3 - "$RUN_KEY" </tmp/comments.json <<'PY'
          import json, sys
          run_key = sys.argv[1]
          prefix = f"IDOL_OPENCLAW_CIPHERTEXT:{run_key}\n"
          comments = json.load(sys.stdin)
          for comment in reversed(comments):
              body = comment.get("body") or ""
              if body.startswith(prefix):
                  print(body[len(prefix):].strip())
                  break
          PY
            )"
            if [ -n "$cipher" ]; then
              break
            fi
            sleep 2
          done
          if [ -z "$cipher" ]; then
            printf '%s\n' '{"schema":"idol.openclaw.probe.v1","outcome":"ciphertext-timeout"}' > probe-result.json
            exit 0
          fi

          printf '%s' "$cipher" | base64 -d >/tmp/idol-openclaw-cipher.bin
          openssl pkeyutl -decrypt \
            -inkey /tmp/idol-openclaw-private.pem \
            -in /tmp/idol-openclaw-cipher.bin \
            -pkeyopt rsa_padding_mode:oaep \
            -pkeyopt rsa_oaep_md:sha256 \
            -out /tmp/idol-openclaw-token
          token="$(cat /tmp/idol-openclaw-token)"
          echo "::add-mask::$token"
          unset token cipher

          mkdir -p /tmp/idol-openclaw-probe
          cd /tmp/idol-openclaw-probe
          npm init -y >/dev/null 2>&1
          npm install --silent ws@8
          cat >probe.mjs <<'JS'
          import fs from "node:fs";
          import crypto from "node:crypto";
          import WebSocket from "ws";

          const token = fs.readFileSync("/tmp/idol-openclaw-token", "utf8").trim();
          const gatewayUrl = "wss://claw.idol.id";
          const timeoutMs = 45_000;
          const pending = new Map();
          const events = new Map();
          let serial = 0;
          let connected = false;
          let connectSent = false;

          const sensitiveKey = /(token|password|secret|credential|cookie|authorization|api.?key|private.?key|bootstrap)/i;
          const contentKey = /^(message|messages|content|text|prompt|transcript|preview|history|reasoning|summary|body|output)$/i;
          const pathKey = /(^|_)(path|cwd|dir|root|home|workspace)(_|$)|repoRoot|stateDir/i;

          function sanitize(value, key = "", depth = 0) {
            if (depth > 8) return "[depth-omitted]";
            if (sensitiveKey.test(key)) return "[redacted]";
            if (contentKey.test(key)) return "[content-omitted]";
            if (pathKey.test(key)) return "[path-omitted]";
            if (value === null || value === undefined) return value;
            if (typeof value === "string") return value.length > 500 ? `${value.slice(0, 500)}…` : value;
            if (typeof value === "number" || typeof value === "boolean") return value;
            if (Array.isArray(value)) return value.slice(0, 100).map((entry) => sanitize(entry, key, depth + 1));
            if (typeof value === "object") {
              const out = {};
              for (const [childKey, childValue] of Object.entries(value)) {
                out[childKey] = sanitize(childValue, childKey, depth + 1);
              }
              return out;
            }
            return String(value);
          }

          function compactError(error) {
            if (!error) return { message: "unknown" };
            return sanitize({
              code: error.code,
              message: error.message ?? String(error),
              details: error.details,
              retryable: error.retryable,
              retryAfterMs: error.retryAfterMs,
            });
          }

          const ws = new WebSocket(gatewayUrl, {
            handshakeTimeout: 20_000,
            perMessageDeflate: false,
            headers: { "User-Agent": "idol-openclaw-readonly-probe/0.1" },
          });

          function request(method, params = {}, callTimeoutMs = timeoutMs) {
            return new Promise((resolve, reject) => {
              const id = `idol-${++serial}-${crypto.randomUUID()}`;
              const timer = setTimeout(() => {
                pending.delete(id);
                reject({ code: "CLIENT_TIMEOUT", message: `timeout:${method}` });
              }, callTimeoutMs);
              pending.set(id, { resolve, reject, timer, method });
              ws.send(JSON.stringify({ type: "req", id, method, params }));
            });
          }

          async function sendConnect() {
            if (connectSent) return;
            connectSent = true;
            return request("connect", {
              minProtocol: 4,
              maxProtocol: 4,
              client: {
                id: "gateway-client",
                version: "0.1.0",
                platform: "linux",
                mode: "backend",
              },
              role: "operator",
              scopes: ["operator.read"],
              caps: ["agent-kind"],
              commands: [],
              permissions: {},
              auth: { token },
              locale: "en-US",
              userAgent: "idol-openclaw-readonly-probe/0.1",
            }, 45_000);
          }

          ws.on("message", (raw) => {
            let frame;
            try { frame = JSON.parse(raw.toString("utf8")); } catch { return; }
            if (frame?.type === "event" && typeof frame.event === "string") {
              events.set(frame.event, (events.get(frame.event) ?? 0) + 1);
              if (frame.event === "connect.challenge") void sendConnect();
              return;
            }
            if (frame?.type === "res" && typeof frame.id === "string") {
              const waiter = pending.get(frame.id);
              if (!waiter) return;
              clearTimeout(waiter.timer);
              pending.delete(frame.id);
              if (frame.ok) waiter.resolve(frame.payload);
              else waiter.reject(frame.error ?? { message: "gateway request failed" });
            }
          });

          const opened = new Promise((resolve, reject) => {
            const timer = setTimeout(() => reject({ code: "OPEN_TIMEOUT", message: "websocket open timeout" }), 25_000);
            ws.once("open", () => {
              clearTimeout(timer);
              setTimeout(() => { if (!connectSent) void sendConnect(); }, 1500);
              resolve();
            });
            ws.once("error", (error) => {
              clearTimeout(timer);
              reject(error);
            });
          });

          async function probe(method, params = {}) {
            const started = Date.now();
            try {
              const payload = await request(method, params);
              return { ok: true, elapsedMs: Date.now() - started, payload: sanitize(payload) };
            } catch (error) {
              return { ok: false, elapsedMs: Date.now() - started, error: compactError(error) };
            }
          }

          const report = {
            schema: "idol.openclaw.probe.v1",
            observedAt: new Date().toISOString(),
            gatewayUrl,
            outcome: "unknown",
            gateway: {},
            advertised: {},
            probes: {},
          };

          try {
            await opened;
            const hello = await sendConnect();
            connected = true;
            const methods = Array.isArray(hello?.features?.methods) ? hello.features.methods : [];
            const methodSet = new Set(methods);
            report.outcome = "connected-readonly";
            report.gateway = sanitize({
              protocol: hello?.protocol,
              server: hello?.server,
              auth: hello?.auth,
              policy: hello?.policy,
              snapshot: {
                appliedConfigHash: hello?.snapshot?.appliedConfigHash,
                health: hello?.snapshot?.health,
                stateVersion: hello?.snapshot?.stateVersion,
              },
            });
            report.advertised = {
              methodCount: methods.length,
              methods: methods.slice().sort(),
              eventCount: Array.isArray(hello?.features?.events) ? hello.features.events.length : null,
            };

            const specs = [
              ["health", {}],
              ["status", {}],
              ["system.info", {}],
              ["system-presence", {}],
              ["agents.list", {}],
              ["models.list", {}],
              ["sessions.list", { limit: 100, ownerFirst: true }],
              ["tasks.list", { limit: 100 }],
              ["cron.status", {}],
              ["cron.list", {}],
              ["channels.status", {}],
              ["environments.list", {}],
              ["config.get", {}],
              ["usage.status", {}],
            ];
            for (const [method, params] of specs) {
              report.probes[method] = methodSet.has(method)
                ? await probe(method, params)
                : { ok: false, skipped: "not-advertised" };
            }
          } catch (error) {
            report.outcome = connected ? "probe-failed" : "connect-failed";
            report.error = compactError(error);
          } finally {
            report.eventsObserved = Object.fromEntries([...events.entries()].sort(([a], [b]) => a.localeCompare(b)));
            fs.writeFileSync("probe-result.json", JSON.stringify(report, null, 2));
            try { ws.close(1000, "probe-complete"); } catch {}
          }
          JS
          node probe.mjs
          cp probe-result.json "$GITHUB_WORKSPACE/probe-result.json"

      - name: Upload sanitized result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: openclaw-probe-${{ steps.key.outputs.run_key }}
          path: probe-result.json
          retention-days: 1
          if-no-files-found: error

      - name: Destroy ephemeral key material
        if: always()
        shell: bash
        run: |
          rm -f /tmp/idol-openclaw-private.pem /tmp/idol-openclaw-public.pem \
            /tmp/idol-openclaw-cipher.bin /tmp/idol-openclaw-token /tmp/comments.json
