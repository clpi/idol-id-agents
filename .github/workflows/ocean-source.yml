name: Pinned public source for Ocean verification
on:
  push:
    branches: [verify/ocean-source-20261030]
    paths: [.github/workflows/ocean-source.yml]
permissions:
  contents: read
jobs:
  source:
    if: github.actor == 'clpi'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: 40cad7d9a45306d68265f145dfe698699620a4bb
          persist-credentials: false
          fetch-depth: 1
      - name: Retain only exact already-public tracked source
        shell: bash
        run: |
          python3 - <<'PY'
          import gzip, hashlib, json, os, pathlib, subprocess
          def git(*args):
              return subprocess.run(['git', *args], check=True, capture_output=True, timeout=30).stdout
          revision = git('rev-parse', 'HEAD').decode().strip()
          assert revision == '40cad7d9a45306d68265f145dfe698699620a4bb'
          root = pathlib.Path(os.environ['RUNNER_TEMP']) / 'ocean-public-source'
          root.mkdir(mode=0o700)
          archive = gzip.compress(git('archive', '--format=tar', 'HEAD'), mtime=0)
          commit = git('cat-file', 'commit', 'HEAD')
          assert len(archive) < 1000000
          (root / 'source.tar.gz').write_bytes(archive)
          (root / 'commit.raw').write_bytes(commit)
          manifest = {'revision':revision,'tree':git('rev-parse','HEAD^{tree}').decode().strip(),
                      'files':{'source.tar.gz':hashlib.sha256(archive).hexdigest(),
                               'commit.raw':hashlib.sha256(commit).hexdigest()},
                      'bytes':len(archive)}
          (root / 'manifest.json').write_text(json.dumps(manifest,sort_keys=True)+'\n')
          print(json.dumps(manifest,sort_keys=True))
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ocean-public-controller-40cad7d9
          path: ${{ runner.temp }}/ocean-public-source/
          retention-days: 1
          compression-level: 0
          if-no-files-found: error
