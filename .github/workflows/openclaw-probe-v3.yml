name: OpenClaw read-only inventory probe v3

on:
  push:
    branches:
      - openclaw/browser-probe-20260828
    paths:
      - .github/workflows/openclaw-probe-v3.yml

permissions:
  contents: read
  issues: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4

      - name: Publish ephemeral public key
        id: key
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          run_key="${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          umask 077
          openssl genpkey -algorithm RSA -pkeyopt rsa_keygen_bits:2048 -out /tmp/idol-openclaw-private.pem >/dev/null 2>&1
          openssl pkey -in /tmp/idol-openclaw-private.pem -pubout -out /tmp/idol-openclaw-public.pem >/dev/null 2>&1
          public_b64="$(base64 -w0 /tmp/idol-openclaw-public.pem)"
          body="$(printf 'IDOL_OPENCLAW_KEY:%s\n%s' "$run_key" "$public_b64")"
          jq -n --arg body "$body" '{body:$body}' >/tmp/key-comment.json
          curl -fsS -X POST \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/issues/1/comments" \
            --data-binary @/tmp/key-comment.json >/dev/null
          echo "run_key=$run_key" >>"$GITHUB_OUTPUT"

      - name: Receive ciphertext
        id: receive
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_KEY: ${{ steps.key.outputs.run_key }}
        shell: bash
        run: |
          set -euo pipefail
          cipher=""
          prefix="IDOL_OPENCLAW_CIPHERTEXT:${RUN_KEY}\n"
          for _ in $(seq 1 180); do
            curl -fsS \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/issues/1/comments?per_page=100" \
              >/tmp/comments.json
            cipher="$(jq -r --arg prefix "$prefix" \
              'map(.body // "") | map(select(startswith($prefix))) | (last // "") | ltrimstr($prefix)' \
              /tmp/comments.json)"
            if [ -n "$cipher" ]; then break; fi
            sleep 2
          done
          if [ -z "$cipher" ]; then
            printf '%s\n' '{"schema":"idol.openclaw.probe.v1","outcome":"ciphertext-timeout"}' >probe-result.json
            echo "received=false" >>"$GITHUB_OUTPUT"
            exit 0
          fi
          printf '%s' "$cipher" | base64 -d >/tmp/idol-openclaw-cipher.bin
          openssl pkeyutl -decrypt \
            -inkey /tmp/idol-openclaw-private.pem \
            -in /tmp/idol-openclaw-cipher.bin \
            -pkeyopt rsa_padding_mode:oaep \
            -pkeyopt rsa_oaep_md:sha256 \
            -out /tmp/idol-openclaw-token
          token="$(cat /tmp/idol-openclaw-token)"
          echo "::add-mask::$token"
          unset token cipher
          echo "received=true" >>"$GITHUB_OUTPUT"

      - name: Run sanitized read-only RPC probe
        if: steps.receive.outputs.received == 'true'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/idol-openclaw-node
          cp "$GITHUB_WORKSPACE/scripts/openclaw-readonly-probe.mjs" /tmp/idol-openclaw-node/probe.mjs
          cd /tmp/idol-openclaw-node
          npm init -y >/dev/null 2>&1
          npm install --silent ws@8
          OPENCLAW_TOKEN_FILE=/tmp/idol-openclaw-token \
          OPENCLAW_RESULT_FILE="$GITHUB_WORKSPACE/probe-result.json" \
            node probe.mjs

      - name: Upload sanitized result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: openclaw-probe-${{ steps.key.outputs.run_key }}
          path: probe-result.json
          retention-days: 1
          if-no-files-found: error

      - name: Destroy ephemeral key material
        if: always()
        shell: bash
        run: |
          rm -f /tmp/idol-openclaw-private.pem /tmp/idol-openclaw-public.pem \
            /tmp/idol-openclaw-cipher.bin /tmp/idol-openclaw-token /tmp/comments.json
