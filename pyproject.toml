[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "idol-fleet"
version = "0.1.0"
description = "Fail-closed bootstrap coordinator for Idol Live agent fleets"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
idol-fleet = "idol_fleet.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
